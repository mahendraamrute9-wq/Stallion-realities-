<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Login | Stallion Realties</title>
  <meta name="robots" content="noindex, nofollow" />
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(circle at 50% 30%, rgba(21, 32, 56, 0.85) 0%, rgba(10, 15, 29, 0.98) 80%),
                  url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      position: relative;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(19, 29, 51, 0.92);
      border: 1.5px solid var(--gold-border);
      border-radius: var(--radius-lg);
      padding: 44px 36px;
      box-shadow: var(--shadow-lg), 0 0 50px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: relative;
      z-index: 2;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: var(--gold-gradient);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-gold);
    }

    .login-logo svg {
      width: 32px;
      height: 32px;
      fill: var(--text-dark);
    }

    .login-title {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .alert-error {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      margin-bottom: 22px;
      align-items: center;
      gap: 10px;
    }

    .alert-error.visible {
      display: flex;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:hover {
      color: var(--gold-light);
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 24px;
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .back-home-link:hover {
      color: var(--gold-light);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo"><img src="assets/images/stallion-horse-black-clean.png" alt="Stallion Realties Horse Logo" style="width: 36px; height: auto; object-fit: contain;" /></div>
        <h1 class="login-title">Admin Management</h1>
        <p class="login-subtitle">Stallion Realties &bull; Authorized Personnel Portal</p>
      </div>

      <!-- Error Alert -->
      <div id="loginError" class="alert-error" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <span id="loginErrorText">Invalid credentials</span>
      </div>

      <!-- Login Form -->
      <form id="adminLoginForm">
        <div class="form-field" style="margin-bottom: 20px;">
          <label for="adminUsername" style="font-size: 0.85rem; font-weight: 600; color: var(--gold-light); margin-bottom: 6px; display: block;">Username</label>
          <input 
            type="text" 
            id="adminUsername" 
            class="form-input" 
            placeholder="Enter username" 
            autocomplete="username" 
            required 
            style="width: 100%;" 
          />
        </div>

        <div class="form-field" style="margin-bottom: 26px;">
          <label for="adminPassword" style="font-size: 0.85rem; font-weight: 600; color: var(--gold-light); margin-bottom: 6px; display: block;">Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="adminPassword" 
              class="form-input" 
              placeholder="Enter password" 
              autocomplete="current-password" 
              required 
              style="width: 100%; padding-right: 42px;" 
            />
            <button type="button" id="togglePasswordBtn" class="password-toggle" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-gold" style="width: 100%; height: 48px; font-size: 1rem;">
          Sign In to Dashboard
        </button>
      </form>

      <div style="text-align: center;">
        <a href="index.html" class="back-home-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          Return to Public Website
        </a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect straight to admin dashboard
      if (AuthManager.isAuthenticated()) {
        window.location.href = 'admin.html';
        return;
      }

      const form = document.getElementById('adminLoginForm');
      const userInput = document.getElementById('adminUsername');
      const passInput = document.getElementById('adminPassword');
      const errorBox = document.getElementById('loginError');
      const errorText = document.getElementById('loginErrorText');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const submitBtn = document.getElementById('loginSubmitBtn');

      // Password visibility toggle
      toggleBtn.addEventListener('click', () => {
        const isPassword = passInput.type === 'password';
        passInput.type = isPassword ? 'text' : 'password';
        toggleBtn.innerHTML = isPassword
          ? '<svg viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>'
          : '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
      });

      // Handle Form Submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.remove('visible');

        const originalText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Verifying Credentials...';

        const username = userInput.value.trim();
        const password = passInput.value;

        const result = await AuthManager.login(username, password);

        if (result.success) {
          submitBtn.innerHTML = 'Login Successful &bull; Redirecting...';
          submitBtn.style.background = 'var(--accent-green)';
          setTimeout(() => {
            window.location.href = 'admin.html';
          }, 400);
        } else {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
          errorText.textContent = result.message;
          errorBox.classList.add('visible');
          passInput.value = '';
          passInput.focus();
        }
      });
    });
  </script>
</body>
</html>
